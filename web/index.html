<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prófun</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center;
    font-family:system-ui,sans-serif;background:#F5F4F7;color:#1C1A22}
  h1{font-size:34px;margin:0 0 10px}
  p{color:#6E6979;margin:0}
  code{background:#fff;border:1px solid #E4E1E9;border-radius:5px;padding:2px 7px;font-size:14px}
</style>
</head>
<body>
  <div>
    <h1>Innsýn Is SO ON</h1>
    <p>Síðan er komin í loftið.</p>
    <p style="margin-top:14px"><code id="when"></code></p>
  </div>
  <script>
    document.getElementById("when").textContent =
      "Hlaðið " + new Date().toLocaleString("is-IS");
  </script>
</body>
</html>
